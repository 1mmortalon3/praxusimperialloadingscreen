<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxus Gaming Imperial</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #f3f4f6;
    font-family: "Arial Narrow", "Roboto Condensed", Tahoma, Arial, sans-serif;
}

#screen {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    background-image: none;
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
}

/* Interface layers stay lightweight for Garry's Mod's embedded browser. */
#screen {
    -webkit-animation: backgroundDrift 18s ease-in-out infinite alternate;
    animation: backgroundDrift 18s ease-in-out infinite alternate;
}

#veil,
#scanlines,
#edgeGlow {
    position: absolute;
    z-index: 1;
    inset: 0;
    pointer-events: none;
}

#veil {
    background:
        linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.08) 28%, rgba(0,0,0,0.10) 62%, rgba(0,0,0,0.86) 100%),
        linear-gradient(90deg, rgba(0,0,0,0.55) 0%, transparent 33%, transparent 67%, rgba(0,0,0,0.34) 100%);
}

#scanlines {
    opacity: 0.12;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 4px);
}

#edgeGlow {
    box-shadow: inset 0 0 110px rgba(0,0,0,0.9), inset 0 -90px 120px rgba(100,0,0,0.12);
}

#videoBackground {
    position: absolute;
    z-index: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #030303;
    opacity: 0;
    pointer-events: none;
    -webkit-animation: backgroundDrift 18s ease-in-out infinite alternate;
    animation: backgroundDrift 18s ease-in-out infinite alternate;
    -webkit-transition: opacity 800ms ease;
    transition: opacity 800ms ease;
}

.ready #videoBackground {
    opacity: 1;
}

#topRail {
    position: absolute;
    z-index: 3;
    top: 5.2%;
    left: 4.5%;
    right: 4.5%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-box-align: start;
    -webkit-align-items: flex-start;
    align-items: flex-start;
    opacity: 0;
    -webkit-transform: translateY(-10px);
    transform: translateY(-10px);
    -webkit-transition: opacity 700ms ease, -webkit-transform 700ms ease;
    transition: opacity 700ms ease, transform 700ms ease;
}

.ready #topRail,
.ready #loadPanel {
    opacity: 1;
    -webkit-transform: translateY(0);
    transform: translateY(0);
}


.eyebrow {
    margin-bottom: 8px;
    color: #e33135;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.eyebrow:before {
    content: "";
    display: inline-block;
    width: 26px;
    height: 2px;
    margin: 0 10px 3px 0;
    background: #e33135;
    box-shadow: 0 0 9px rgba(227,49,53,0.8);
}

#brandTitle {
    margin: 0;
    color: #f5f5f5;
    font-size: 32px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 16px #000;
}

#brandSub {
    margin-top: 9px;
    color: rgba(255,255,255,0.58);
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

#connectionCard {
    min-width: 255px;
    padding: 12px 15px 12px 17px;
    background: linear-gradient(90deg, rgba(8,8,10,0.78), rgba(8,8,10,0.42));
    border-left: 2px solid #d71920;
    text-align: right;
    box-shadow: -10px 0 28px rgba(0,0,0,0.28);
}

#signalLine {
    color: #e6e6e6;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}

#signalDot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin: 0 0 1px 8px;
    border-radius: 50%;
    background: #f0282e;
    box-shadow: 0 0 9px #ef2026;
    -webkit-animation: signalPulse 1.6s ease-in-out infinite;
    animation: signalPulse 1.6s ease-in-out infinite;
}

#serverName {
    max-width: 360px;
    margin-top: 7px;
    overflow: hidden;
    color: rgba(255,255,255,0.66);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-overflow: ellipsis;
    text-transform: uppercase;
    white-space: nowrap;
}

#audioControl {
    margin-top: 9px;
    padding: 5px 9px;
    color: rgba(255,255,255,0.64);
    font: inherit;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.13);
    cursor: pointer;
}

#audioControl:hover,
#audioControl:focus {
    color: #fff;
    border-color: rgba(215,25,32,0.72);
    outline: none;
}

#loadPanel {
    position: absolute;
    z-index: 3;
    left: 5.5%;
    right: 5.5%;
    bottom: 5.2%;
    padding: 16px 18px 14px;
    background: linear-gradient(180deg, rgba(8,8,10,0.86), rgba(3,3,4,0.94));
    border: 1px solid rgba(255,255,255,0.12);
    border-top-color: rgba(220,32,38,0.82);
    box-shadow: 0 18px 50px rgba(0,0,0,0.52), 0 0 24px rgba(145,0,0,0.16);
    opacity: 0;
    -webkit-transform: translateY(14px);
    transform: translateY(14px);
    -webkit-transition: opacity 700ms ease 180ms, -webkit-transform 700ms ease 180ms;
    transition: opacity 700ms ease 180ms, transform 700ms ease 180ms;
}

#statusRow,
#metaRow {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
}

#statusRow {
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    margin-bottom: 10px;
}

#statusText {
    overflow: hidden;
    color: #f0f0f0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-overflow: ellipsis;
    text-transform: uppercase;
    white-space: nowrap;
}

#statusText:before {
    content: "//";
    margin-right: 9px;
    color: #d71920;
}

#loadingDots {
    min-width: 42px;
    margin-left: 18px;
    text-align: right;
    white-space: nowrap;
}

#loadingDots span {
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-left: 5px;
    border-radius: 50%;
    background: #e02b31;
    box-shadow: 0 0 8px rgba(224,43,49,0.76);
    -webkit-animation: dotPulse 1.2s ease-in-out infinite;
    animation: dotPulse 1.2s ease-in-out infinite;
}

#loadingDots span:nth-child(2) { -webkit-animation-delay: 180ms; animation-delay: 180ms; }
#loadingDots span:nth-child(3) { -webkit-animation-delay: 360ms; animation-delay: 360ms; }

#metaRow {
    margin-top: 11px;
    color: rgba(255,255,255,0.48);
    font-size: 10px;
    letter-spacing: 1.25px;
    text-transform: uppercase;
}

.metaItem {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.metaItem + .metaItem {
    margin-left: 22px;
    padding-left: 22px;
    border-left: 1px solid rgba(255,255,255,0.13);
}

.metaLabel {
    margin-right: 6px;
    color: #d62a2f;
    font-weight: 700;
}

#tip {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
}

@-webkit-keyframes signalPulse {
    0%, 100% { opacity: 0.5; -webkit-transform: scale(0.85); }
    50% { opacity: 1; -webkit-transform: scale(1); }
}

@keyframes signalPulse {
    0%, 100% { opacity: 0.5; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
}

@-webkit-keyframes dotPulse {
    0%, 70%, 100% { opacity: 0.25; -webkit-transform: translateY(0); }
    35% { opacity: 1; -webkit-transform: translateY(-3px); }
}

@keyframes dotPulse {
    0%, 70%, 100% { opacity: 0.25; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-3px); }
}

@-webkit-keyframes backgroundDrift {
    from { -webkit-transform: scale(1.015); }
    to { -webkit-transform: scale(1.035); }
}

@keyframes backgroundDrift {
    from { transform: scale(1.015); }
    to { transform: scale(1.035); }
}

@media screen and (max-width: 800px), screen and (max-height: 620px) {
    #topRail { top: 4%; left: 5%; right: 5%; }
    #brandTitle { font-size: 23px; }
    #brandSub { font-size: 9px; letter-spacing: 3px; }
    #connectionCard { min-width: 190px; padding: 9px 11px; }
    #loadPanel { left: 5%; right: 5%; bottom: 4%; padding: 12px 13px; }
    #metaRow { font-size: 9px; }
    #tip { display: none; }
}

@media screen and (max-width: 560px) {
    #connectionCard { display: none; }
    #brandTitle { font-size: 20px; }
    .metaItem + .metaItem { margin-left: 12px; padding-left: 12px; }
}

@media (prefers-reduced-motion: reduce) {
    #screen, #videoBackground, #signalDot, #loadingDots span { -webkit-animation: none; animation: none; }
}
</style>
</head>
<body>
<div id="screen"></div>
<div id="veil"></div>
<div id="scanlines"></div>
<div id="edgeGlow"></div>
<video id="videoBackground" autoplay loop muted playsinline preload="auto">
    <source src="dark-lords-army.1920x1080.mp4" type="video/mp4">
</video>

<header id="topRail">
    <div id="branding">
        <div class="eyebrow">Praxus Gaming Network</div>
        <h1 id="brandTitle">Praxus Gaming</h1>
        <div id="brandSub">Imperial Roleplay</div>
    </div>
    <div id="connectionCard">
        <div id="signalLine">Secure uplink established <span id="signalDot"></span></div>
        <div id="serverName">Awaiting server transmission</div>
        <button id="audioControl" type="button" aria-pressed="false">Audio // On</button>
    </div>
</header>

<main id="loadPanel" aria-live="polite">
    <div id="statusRow">
        <div id="statusText">Establishing Imperial uplink</div>
        <div id="loadingDots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div id="metaRow">
        <div class="metaItem"><span class="metaLabel">Map</span><span id="mapName">Unknown sector</span></div>
        <div class="metaItem" id="tip"><span class="metaLabel">Directive</span><span id="tipText">Review the server rules before deployment.</span></div>
    </div>
</main>

<script>
(function () {
    var currentStatus = 'Establishing Imperial uplink';
    var tips = [
        'Review the server rules before deployment.',
        'Use communications channels for clear roleplay coordination.',
        'Stay in character during active scenarios.',
        'Workshop download speed depends on your connection.'
    ];
    var tipIndex = 0;
    var statusText = document.getElementById('statusText');
    var serverName = document.getElementById('serverName');
    var mapName = document.getElementById('mapName');
    var tipText = document.getElementById('tipText');
    var audio = document.getElementById('ambientAudio');
    var audioControl = document.getElementById('audioControl');
    var videoBackground = document.getElementById('videoBackground');
    var fallbackAudioSource = audio.src;
    var playlist = [
        'Star Wars_ Emperor Palpatine Theme EPIC DARK SIDE VERSION(1).ogg',
        'Star-Wars_-Imperial-March-Darth-Vader-Theme-EPIC-VERSION.ogg'
    ];
    var trackIndex = -1;
    var failedTracks = 0;
    var playlistStarted = false;

    function cleanText(value, fallbackText) {
        value = String(value || '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
        return value || fallbackText;
    }

    function setStatus(value) {
        currentStatus = cleanText(value, currentStatus);
        statusText.textContent = currentStatus;
    }

    function updateAudioLabel() {
        var off = audio.paused || audio.muted || audio.volume === 0;
        audioControl.textContent = off ? 'Audio // Off' : 'Audio // On';
        audioControl.setAttribute('aria-pressed', off ? 'true' : 'false');
    }

    function startAudio() {
        var playResult = audio.play();
        if (playResult && typeof playResult.then === 'function') {
            playResult.then(updateAudioLabel, updateAudioLabel);
        } else {
            updateAudioLabel();
        }
    }

    function startVideo() {
        videoBackground.muted = true;
        var playResult = videoBackground.play();
        if (playResult && typeof playResult.catch === 'function') {
            playResult.catch(function () {});
        }
    }

    function loadTrack(index) {
        trackIndex = index;
        audio.loop = false;
        audio.src = playlist[trackIndex];
        audio.load();
        startAudio();
    }

    function startPlaylist() {
        if (!playlistStarted) {
            playlistStarted = true;
            loadTrack(0);
        } else {
            startAudio();
        }
    }

    audio.onended = function () {
        loadTrack((trackIndex + 1) % playlist.length);
    };

    audio.onerror = function () {
        failedTracks += 1;
        if (failedTracks < playlist.length) {
            loadTrack((trackIndex + 1) % playlist.length);
        } else {
            audio.onerror = null;
            audio.loop = true;
            audio.src = fallbackAudioSource;
            audio.load();
            startAudio();
        }
    };

    audio.volume = 0.22;

    audioControl.onclick = function () {
        if (audio.paused) {
            audio.muted = false;
            startPlaylist();
        } else {
            audio.pause();
            updateAudioLabel();
        }
    };

    /* Only server/map and status callbacks are used. Download progress callbacks
       are intentionally omitted so this page does not draw a download bar. */
    window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
        serverName.textContent = cleanText(servername, 'Praxus Gaming Imperial');
        mapName.textContent = cleanText(mapname, 'Unknown sector');
        setStatus('Authenticating deployment request');
        volume = parseFloat(volume);
        if (isFinite(volume)) {
            audio.volume = Math.max(0, Math.min(0.35, volume * 0.35));
        }
        startPlaylist();
    };

    window.SetStatusChanged = function(status) {
        setStatus(status);
        var s = String(status || '').toLowerCase();

        if (s.indexOf('sending client info') !== -1) {
            setStatus('Sending client credentials');
        } else if (s.indexOf('receiving client info') !== -1) {
            setStatus('Receiving deployment clearance');
        } else if (s.indexOf('starting lua') !== -1 || s.indexOf('lua started') !== -1) {
            setStatus('Initializing server systems');
        } else if (s.indexOf('ready') !== -1 || s.indexOf('connected') !== -1) {
            setStatus('Deployment authorized');
        }
    };

    setTimeout(function () {
        document.documentElement.className += ' ready';
        startVideo();
        startPlaylist();
    }, 120);

    setInterval(function () {
        tipIndex = (tipIndex + 1) % tips.length;
        tipText.textContent = tips[tipIndex];
    }, 6500);
})();
</script>
</body>
</html>
