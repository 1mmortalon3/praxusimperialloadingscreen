<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Praxus Gaming Imperial</title>
  <meta name="application-name" content="Praxus Gaming Imperial" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="loading-screen" aria-label="Praxus Gaming Imperial loading screen">
    <div class="background" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="loading-ui" aria-label="Loading progress">
      <div
        id="loading-bar"
        class="loading-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="loading-fill" class="loading-fill"></div>
        <div class="loading-sheen" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
